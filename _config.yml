# Build settings
markdown: kramdown
theme: minima
description: "Simon Bourrat // Chef Op . Drone . Réalisateur // Lyon, Paris"

# Cloudflare Web Analytics (gratuit, sans cookie, sans bandeau de consentement).
# Mettre "" pour desactiver.
cloudflare_analytics_token: "4f444af3c84940949be52c153ef4adda"

defaults:
  -
    scope:
      path: ""
    values:
      title: "Simon Bourrat"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - vendor/
  - node_modules/
  - psd/
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - flightplan.js
