# Build settings
markdown: kramdown
theme: minima
description: "Simon Bourrat // Chef Op . Drone . Réalisateur // Lyon, Paris"

# Mesure d'audience (Google Analytics 4).
# Laisser vide pour ne charger aucun script de tracking.
# Pour activer : mettre l'ID de mesure GA4, ex. "G-XXXXXXXXXX".
google_analytics: ""

defaults:
  -
    scope:
      path: ""
    values:
      title: "Simon Bourrat"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - vendor/
  - node_modules/
  - psd/
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - flightplan.js
