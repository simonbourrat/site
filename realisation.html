---
layout: page
---
<style>

</style>
<section class="module-extra-small">
    <style>
        .video-grid-item {
            margin-bottom: 40px;
        }
        .video-grid-item iframe {
            width: 100%;
            height: 215px;
            display: block;
        }
        .video-grid-info {
            margin-top: 12px;
        }
        .video-grid-info h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: left;
        }
        .video-grid-info p {
            margin: 0;
            font-size: 12px;
            color: #999;
            text-align: left;
        }
        /* YouTube impose son propre ratio : on force la meme taille que les Vimeo
           via un conteneur a hauteur fixe + iframe en position absolue */
        .video-grid-item .yt-wrap {
          position: relative;
          width: 100%;
          height: 215px;
          overflow: hidden;
        }
        .video-grid-item .yt-wrap iframe {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100% !important;
          max-height: 100% !important;
        }
        @media (min-width: 576px) {
          .video-grid-item iframe { height: 200px; }
          .video-grid-item .yt-wrap { height: 200px; }
        }
        @media (min-width: 768px) {
          .video-grid-item iframe { height: 190px; }
          .video-grid-item .yt-wrap { height: 190px; }
        }
        @media (min-width: 992px) {
          .video-grid-item iframe { height: 210px; }
          .video-grid-item .yt-wrap { height: 210px; }
        }
        @media (min-width: 1200px) {
          .video-grid-item iframe { height: 240px; }
          .video-grid-item .yt-wrap { height: 240px; }
        }
    </style>
    <div class="container">
        <div class="row">
            {% for video in site.data.realisation %}
            <div class="col-xs-12 col-sm-6 col-md-4 video-grid-item">
                {% if video.platform == "youtube" %}
                <div class="yt-wrap">
                <iframe src="https://www.youtube.com/embed/{{ video.id }}" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                </div>
                {% else %}
                <iframe src="https://player.vimeo.com/video/{{ video.id }}?title=0&byline=0&portrait=0" frameborder="0"
                        webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
                {% endif %}
                <div class="video-grid-info">
                    <h3>{{ video.titre }}</h3>
                    {% if video.description %}<p>{{ video.description }}</p>{% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
