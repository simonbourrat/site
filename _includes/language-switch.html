{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.fr %}
<style>
    /* Petit bouton discret, present sur toutes les pages (y compris l'accueil
       qui masque la navbar et le pied de page). */
    .lang-switch {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 9999;
        display: inline-block;
        padding: 7px 12px;
        font: 11px/1 Arial, Helvetica, sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #dddddd;
        background: rgba(17, 17, 17, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 2px;
        text-decoration: none;
        transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
    }
    .lang-switch:hover,
    .lang-switch:focus {
        color: #ffffff;
        background: rgba(0, 0, 0, 0.92);
        border-color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
    }
    @media (max-width: 767px) {
        .lang-switch {
            right: 12px;
            bottom: 12px;
            padding: 6px 10px;
        }
    }
</style>
<a class="lang-switch"
   href="{{ page.switch_url | default: '/en/' }}"
   lang="{% if page.lang == 'en' %}fr{% else %}en{% endif %}"
   aria-label="{% if page.lang == 'en' %}Passer en français{% else %}Switch to English{% endif %}">{{ page.switch_label | default: 'EN' }}</a>
