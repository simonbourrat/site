{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.fr %}
<style>
  .contact--bg {
    background: rgba(17, 17, 17, 0.8);
    margin-right: 0;
    margin-left: 0;
  }
  .bio-text {
    font-size: 13px;
    line-height: 1.8;
  }
  .bio-text p {
    margin-bottom: 15px;
  }
  /* Coordonnees sous le texte de la bio */
  .bio-contact {
    margin-top: 25px;
    white-space: nowrap;
  }
  /* Photo de presentation : pleine largeur de sa colonne, fond noir */
  .contact-photo {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 25px auto;
    background-color: #000;
    padding: 8px;
  }
  /* Reseaux sociaux sous la photo */
  .contact-social {
    text-align: center;
    margin-bottom: 25px;
  }
  .contact-social a {
    display: inline-block;
    padding: 0 12px;
    color: #cccccc;
    font-size: 22px;
    transition: color 0.3s ease;
  }
  .contact-social a:hover,
  .contact-social a:focus {
    color: #ffffff;
  }
  /* Espace avant le formulaire */
  .contact-form-block {
    margin-top: 60px;
  }
  /* Fond noir uni (plus de photo de montagne) */
  #contact.home-section {
    background-color: #000;
    background-image: none;
  }
  @media (max-width: 767px) {
    .contact-photo {
      margin-bottom: 20px;
    }
    .contact-form-block {
      margin-top: 40px;
    }
  }
</style>
<section class="module home-section home-full-height bg-dark  bg" id="contact">
  <div class="container">
    <div class="row">
      <div class="col-sm-8 col-sm-offset-2">
        <h2 class="module-title font-alt">Simon Bourrat</h2>
      </div>
    </div>

    <!-- Photo + texte descriptif cote a cote -->
    <div class="row mb-30">
      <div class="col-sm-4 col-sm-offset-2">
        <img class="contact-photo" src="assets/images/photo_page_contact.jpg"
             alt="Simon Bourrat"/>
        <div class="contact-social">
          {% for link in site.data.contact.social %}
          <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" title="{{ link.name }}">
            <i class="fa {{ link.icon }}"></i>
          </a>
          {% endfor %}
        </div>
      </div>
      <div class="col-sm-4 bio-text">
        {% for para in t.bio %}<p>{{ para }}</p>
        {% endfor %}
        <p class="bio-contact">
          <span class="icon-envelope" style="width: 20px"></span> <a href="mailto:{{site.data.contact.email}}">{{site.data.contact.email}}</a>
          <span class="icon-mobile" style="width: 20px; margin-left: 20px"></span> <a href="tel:{{site.data.contact.phone.number}}">{{site.data.contact.phone.display}}</a>
        </p>
      </div>
    </div>

    <!-- Formulaire de contact -->
    <div class="row contact-form-block">
      <div class="col-sm-8 col-sm-offset-2">
        <form name="contact" netlify-honeypot="phone" netlify>
          <div class="form-group">
            <label class="sr-only" for="name">{{ t.label_name }}</label>
            <input class="form-control" type="text" id="name" name="name" placeholder="{{ t.form_name }}"
                   required="required"
                   data-validation-required-message="{{ t.err_name }}"/>
            <p class="help-block text-danger"></p>
          </div>
          <div class="form-group">
            <label class="sr-only" for="email">{{ t.label_email }}</label>
            <input class="form-control" type="email" id="email" name="email"
                   placeholder="{{ t.form_email }}" required="required"
                   data-validation-required-message="{{ t.err_email }}"/>
            <p class="help-block text-danger"></p>
          </div>
          <div class="form-group">
            <label class="sr-only" for="message">{{ t.label_message }}</label>
            <textarea class="form-control" rows="7" id="message" name="message"
                      placeholder="{{ t.form_message }}" required="required"
                      data-validation-required-message="{{ t.err_message }}"></textarea>
            <p class="help-block text-danger"></p>
          </div>
          <div class="text-center">
            <button class="btn btn-block btn-round btn-d" id="cfsubmit" type="submit">{{ t.form_send }}
            </button>
          </div>
        </form>
        <div class="ajax-response font-alt" id="contactFormResponse"></div>
      </div>
    </div>
  </div>
</section>
