name: Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # Current stable Ruby version
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Gulp 4 and modern Node.js versions
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Build website
      run: npm run build
